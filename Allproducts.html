<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row items-center justify-between mb-6 sm:mb-8 gap-4">
            <button onclick="window.location.href='index.html'" class="w-full sm:w-auto bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back
            </button>
            <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-center">Product Management</h1>
            <button id="addProductBtn" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Add Product
            </button>
        </div>

        <div class="products-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 md:gap-5">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <!-- Edit/Add Product Modal -->
    <div id="productModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-auto">
            <div class="flex justify-between items-center p-4 sm:p-6 border-b">
                <h3 id="modalTitle" class="text-xl font-semibold">Add Product</h3>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700">&times;</button>
            </div>
            <form id="productForm" class="p-4 sm:p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                    <input type="text" id="productName" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
                    <div class="flex gap-2">
                        <input type="url" id="imageUrl" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                        <input type="file" id="imageFile" accept="image/*" class="hidden">
                        <button type="button" id="replaceImageBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm whitespace-nowrap">
                            Replace
                        </button>
                    </div>
                </div>
                <div class="preview-image-container hidden">
                    <img id="previewImage" class="w-full h-40 object-cover rounded" alt="Preview">
                </div>
                <input type="hidden" id="productId">
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://substitution-form-shopify-app-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // DOM Elements
        const productModal = document.getElementById('productModal');
        const closeModal = document.getElementById('closeModal');
        const addProductBtn = document.getElementById('addProductBtn');
        const productForm = document.getElementById('productForm');
        const productName = document.getElementById('productName');
        const imageUrl = document.getElementById('imageUrl');
        const productId = document.getElementById('productId');
        const modalTitle = document.getElementById('modalTitle');
        const previewImage = document.getElementById('previewImage');
        const previewContainer = document.querySelector('.preview-image-container');
        const productsGrid = document.querySelector('.products-grid');

        // Event Listeners
        addProductBtn.addEventListener('click', () => openModal());
        closeModal.addEventListener('click', closeModalHandler);
        productForm.addEventListener('submit', handleProductSubmit);
        imageUrl.addEventListener('input', handleImagePreview);
        document.getElementById('replaceImageBtn').addEventListener('click', () => {
            document.getElementById('imageFile').click();
        });

        document.getElementById('imageFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                try {
                    // Convert the file to base64
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const base64Image = e.target.result;
                        imageUrl.value = base64Image;
                        handleImagePreview();
                    };
                    reader.readAsDataURL(file);
                } catch (error) {
                    console.error('Error processing image:', error);
                    alert('Error processing image. Please try again.');
                }
            }
        });

        function openModal(product = null) {
            productModal.classList.remove('hidden');
            if (product) {
                modalTitle.textContent = 'Edit Product';
                productName.value = product.name;
                imageUrl.value = product.imageUrl;
                productId.value = product.id;
                handleImagePreview();
            } else {
                modalTitle.textContent = 'Add Product';
                productForm.reset();
                productId.value = '';
                previewContainer.classList.add('hidden');
            }
        }

        function closeModalHandler() {
            productModal.classList.add('hidden');
            productForm.reset();
            productId.value = '';
            previewContainer.classList.add('hidden');
        }

        function handleImagePreview() {
            if (imageUrl.value) {
                previewImage.src = imageUrl.value;
                previewContainer.classList.remove('hidden');
                previewImage.onerror = () => {
                    previewContainer.classList.add('hidden');
                };
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const product = {
                name: productName.value,
                imageUrl: imageUrl.value
            };

            try {
                if (productId.value) {
                    await database.ref('products/' + productId.value).update(product);
                } else {
                    await database.ref('products').push(product);
                }
                closeModalHandler();
                loadProducts();
            } catch (error) {
                console.error('Error saving product:', error);
                alert('Error saving product. Please try again.');
            }
        }

        function createProductCard(product, id) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow-md overflow-hidden w-full mx-auto';
            card.innerHTML = `
                <div class="aspect-w-4 aspect-h-3">
                    <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">
                </div>
                <div class="p-2 sm:p-3">
                    <h3 class="text-sm sm:text-base font-semibold mb-2 truncate">${product.name}</h3>
                    <div class="flex justify-end space-x-1 sm:space-x-2">
                        <button class="edit-btn bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-xs sm:text-sm">
                            Edit
                        </button>
                        <button class="delete-btn bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs sm:text-sm">
                            Delete
                        </button>
                    </div>
                </div>
            `;

            card.querySelector('.edit-btn').addEventListener('click', () => {
                openModal({ ...product, id });
            });

            card.querySelector('.delete-btn').addEventListener('click', () => {
                if (confirm('Are you sure you want to delete this product?')) {
                    database.ref('products/' + id).remove()
                        .then(() => {
                            loadProducts();
                        })
                        .catch((error) => {
                            console.error('Error deleting product:', error);
                            alert('Error deleting product. Please try again.');
                        });
                }
            });

            return card;
        }

        function loadProducts() {
            database.ref('products').on('value', (snapshot) => {
                productsGrid.innerHTML = '';
                snapshot.forEach((childSnapshot) => {
                    const product = childSnapshot.val();
                    const productCard = createProductCard(product, childSnapshot.key);
                    productsGrid.appendChild(productCard);
                });
            });
        }

        loadProducts();
    </script>
</body>
</html>
