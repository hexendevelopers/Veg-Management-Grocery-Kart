<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="boxTitle">Small Box - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                        </svg>
                        Back to Home
                    </button>
                </div>
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-900">Small Box Management</h1>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Ontario and Quebec Section -->
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex flex-col space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-lg font-medium text-gray-900">Ontario and Quebec</h2>
                            <button class="add-product-btn inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                Add Product
                            </button>
                        </div>
                        <div class="flex items-center space-x-4">
                            <input type="text" class="region-title-input block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3" 
                                   placeholder="Enter title for Ontario and Quebec"
                                   data-region="Ontario and Quebec">
                            <button class="save-title-btn inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                Save Title
                            </button>
                        </div>
                    </div>
                </div>
                <div class="products-list divide-y divide-gray-200">
                    <!-- Products will be inserted here -->
                </div>
            </div>

            <!-- Alberta and British Columbia Section -->
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex flex-col space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-lg font-medium text-gray-900">Alberta and British Columbia</h2>
                            <button class="add-product-btn inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                Add Product
                            </button>
                        </div>
                        <div class="flex items-center space-x-4">
                            <input type="text" class="region-title-input block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3" 
                                   placeholder="Enter title for Alberta and British Columbia"
                                   data-region="Alberta and British Columbia">
                            <button class="save-title-btn inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                Save Title
                            </button>
                        </div>
                    </div>
                </div>
                <div class="products-list divide-y divide-gray-200">
                    <!-- Products will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Search and Add Product Modal -->
    <div id="searchPopup" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden" aria-modal="true">
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div class="relative transform overflow-hidden rounded-lg bg-white px-4 pb-4 pt-5 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg sm:p-6">
                    <div class="absolute right-0 top-0 pr-4 pt-4">
                        <button id="closePopup" class="rounded-md bg-white text-gray-400 hover:text-gray-500 focus:outline-none">
                            <span class="sr-only">Close</span>
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="sm:flex sm:items-start">
                        <div class="w-full">
                            <h3 class="text-lg font-semibold leading-6 text-gray-900 mb-4">Add Product</h3>
                            <div class="relative">
                                <input type="text" id="searchInput" 
                                       class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" 
                                       placeholder="Search products...">
                            </div>
                            
                            <!-- Quantity Input (Initially Hidden) -->
                            <div id="quantityInput" class="hidden mt-4">
                                <label class="block text-sm font-medium text-gray-700">Quantity</label>
                                <input type="text" id="productQuantity" 
                                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" 
                                       placeholder="Enter quantity (e.g., 1 kg, 500g, 2 pieces)">
                            </div>
                            
                            <div id="searchResults" class="mt-4 max-h-60 overflow-y-auto divide-y divide-gray-200">
                                <!-- Search results will appear here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://substitution-form-shopify-app-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Load and save title functionality for each region
        const regionTitleInputs = document.querySelectorAll('.region-title-input');
        const saveTitleButtons = document.querySelectorAll('.save-title-btn');
        
        // Load existing titles when page loads
        regionTitleInputs.forEach(input => {
            const region = input.dataset.region;
            database.ref('Smallbox/' + region.trim() + '/title').once('value')
                .then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        input.value = data;
                    }
                });
        });

        // Save title when save button is clicked
        saveTitleButtons.forEach((button, index) => {
            button.addEventListener('click', () => {
                const input = regionTitleInputs[index];
                const region = input.dataset.region;
                const newTitle = input.value.trim();
                
                if (newTitle) {
                    const titleRef = database.ref('Smallbox/' + region.trim() + '/title');
                    titleRef.set(newTitle)
                        .then(() => {
                            alert('Title saved successfully for ' + region);
                        })
                        .catch((error) => {
                            console.error('Error saving title:', error);
                            alert('Error saving title. Please try again.');
                        });
                } else {
                    alert('Please enter a title before saving');
                }
            });
        });

        const searchPopup = document.getElementById('searchPopup');
        const closePopup = document.getElementById('closePopup');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const quantityInput = document.getElementById('quantityInput');
        const addProductButtons = document.querySelectorAll('.add-product-btn');

        let currentRegion = '';
        let selectedProduct = null;

        addProductButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentRegion = button.closest('.bg-white').querySelector('h2').textContent;
                openPopup(currentRegion);
            });
        });

        closePopup.addEventListener('click', () => {
            searchPopup.classList.add('hidden');
            resetPopup();
        });

        searchInput.addEventListener('input', debounce(searchProducts, 300));

        function openPopup(region) {
            searchPopup.classList.remove('hidden');
            searchInput.value = '';
            searchResults.innerHTML = '';
            quantityInput.classList.add('hidden');
            searchInput.focus();
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function saveProductToRegion(product, region, quantity) {
            const sanitizedRegion = region.trim();
            const newProductRef = database.ref('Smallbox/' + sanitizedRegion).push();
            
            return newProductRef.set({
                name: product.name,
                imageUrl: product.imageUrl,
                quantity: quantity
            });
        }

        function resetPopup() {
            searchInput.value = '';
            searchResults.innerHTML = '';
            quantityInput.classList.add('hidden');
            selectedProduct = null;
        }

        function searchProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            
            database.ref('products').once('value')
                .then((snapshot) => {
                    searchResults.innerHTML = '';
                    snapshot.forEach((childSnapshot) => {
                        const product = childSnapshot.val();
                        if (product.name && product.name.toLowerCase().includes(searchTerm)) {
                            const div = document.createElement('div');
                            div.className = 'flex items-center p-4 hover:bg-gray-50 cursor-pointer';
                            div.innerHTML = `
                                <img src="${product.imageUrl}" alt="${product.name}" class="w-12 h-12 object-cover rounded-md mr-4">
                                <span class="flex-1 text-sm text-gray-900">${product.name}</span>
                            `;
                            div.addEventListener('click', () => {
                                selectedProduct = product;
                                quantityInput.classList.remove('hidden');
                                document.getElementById('productQuantity').focus();
                                
                                // Add event listener for quantity input
                                document.getElementById('productQuantity').onkeypress = function(e) {
                                    if (e.key === 'Enter') {
                                        const quantity = this.value;
                                        if (quantity) {
                                            saveProductToRegion(selectedProduct, currentRegion, quantity).then(() => {
                                                loadProducts();
                                            });
                                            searchPopup.classList.add('hidden');
                                            resetPopup();
                                        }
                                    }
                                };
                            });
                            searchResults.appendChild(div);
                        }
                    });
                })
                .catch((error) => {
                    console.error("Error fetching products:", error);
                });
        }

        // Load products for each region
        function loadProducts() {
            const regions = document.querySelectorAll('.bg-white.rounded-lg.shadow');
            regions.forEach(region => {
                const regionName = region.querySelector('h2').textContent;
                const productsList = region.querySelector('.products-list');
                
                database.ref('Smallbox/' + regionName.trim()).on('value', (snapshot) => {
                    productsList.innerHTML = '';
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnapshot) => {
                            if (childSnapshot.key !== 'title') {  // Skip the title node
                                const product = childSnapshot.val();
                                const productKey = childSnapshot.key;
                                
                                const productDiv = document.createElement('div');
                                productDiv.className = 'p-6 hover:bg-gray-50';
                                productDiv.innerHTML = `
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center min-w-0 gap-x-4">
                                            <img src="${product.imageUrl}" alt="${product.name}" class="h-12 w-12 flex-none rounded-full object-cover">
                                            <div class="min-w-0 flex-auto">
                                                <p class="text-sm font-semibold leading-6 text-gray-900">${product.name}</p>
                                                <p class="mt-1 text-xs leading-5 text-gray-500">${product.quantity}</p>
                                            </div>
                                        </div>
                                        <button class="delete-btn text-gray-400 hover:text-red-500" data-key="${productKey}">
                                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482A41.03 41.03 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" />
                                            </svg>
                                        </button>
                                    </div>
                                `;
                                
                                const deleteBtn = productDiv.querySelector('.delete-btn');
                                deleteBtn.addEventListener('click', () => {
                                    if(confirm('Are you sure you want to delete this product?')) {
                                        database.ref('Smallbox/' + regionName.trim() + '/' + productKey).remove()
                                            .then(() => {
                                                alert('Product deleted successfully');
                                            })
                                            .catch((error) => {
                                                console.error('Error deleting product:', error);
                                                alert('Error deleting product. Please try again.');
                                            });
                                    }
                                });
                                
                                productsList.appendChild(productDiv);
                            }
                        });
                    }
                });
            });
        }

        loadProducts();
    </script>
</body>
</html>
