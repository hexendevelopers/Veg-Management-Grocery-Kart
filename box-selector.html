<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        #product-image {
            width: 2rem;
            height: 4.5rem;
            margin: 0 auto;
            margin-bottom: 0.25rem;
        }
        
        #product-name {
            font-size: 11px;
            line-height: 1.2;
            font-weight: bold;
            color: #1a1a1a;
        }
        
        #product-quantity {
            font-size: 0.75rem;
            color: #4a4a4a;
        }
    </style>
</head>
<body class=" min-h-screen">
 

     <div class="w-[500px] mx-auto py-8">
        <div class="bg-[#8B2942] p-3 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold text-white">This week's harvest</h1>
                    <p id="region-title" class="text-xs text-white"></p>
                </div>
                <div class="relative">
                    <select id="province" class="bg-transparent text-white border-2 border-white rounded-full px-4 py-1 text-sm appearance-none pr-8 cursor-pointer">
                        <option value="ontario_quebec" class="text-black" selected>Ontario and Quebec</option>
                        <option value="alberta_bc" class="text-black">Alberta and British Columbia</option>
                    </select>
                </div>
            </div>
        </div>

        <div class=" p-4">
            <div id="productsList" class="grid grid-cols-5 gap-2">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            databaseURL: "https://substitution-form-shopify-app-default-rtdb.firebaseio.com"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
                console.log('Firebase initialized successfully');
            } catch (error) {
                console.error('Firebase initialization error:', error);
            }
        }
        const database = firebase.database();

        // DOM Elements
        const provinceSelect = document.getElementById('province');
        const productsList = document.getElementById('productsList');
        const regionTitle = document.getElementById('region-title');

        // Box types mapping
        const boxTypeMapping = {
            'all-veggie-box': 'Veggiebox',
            'large-box-mixed': 'Largebox',
            'medium-box-mixed': 'Mediumbox',
            'small-box-mixed': 'Smallbox',
            'all-fruit-box': 'Fruitbox'
        };

        // Get current box type from URL
        function getCurrentBoxType() {
            const url = window.location.href;
            const urlParts = url.split('/');
            const lastPart = urlParts[urlParts.length - 1];
            
            return boxTypeMapping[lastPart] || 'Largebox'; // Default to Largebox if URL doesn't match
        }

        // Event Listeners
        provinceSelect.addEventListener('change', () => {
            loadProducts();
            loadTitle();
        });

        // Initial load
        window.addEventListener('load', () => {
            loadProducts();
            loadTitle();
        });

        // Load title from current box type
        function loadTitle() {
            const region = provinceSelect.value === 'ontario_quebec' ? 'Ontario and Quebec' : 'Alberta and British Columbia';
            const boxType = getCurrentBoxType();
            
            database.ref(boxType + '/' + region + '/title').once('value')
                .then(snapshot => {
                    const title = snapshot.val();
                    if (title) {
                        regionTitle.textContent = title ;
                    } else {
                        regionTitle.textContent = '';
                    }
                })
                .catch(error => {
                    console.error('Error loading title:', error);
                    regionTitle.textContent = '';
                });
        }

        function loadProducts() {
            const region = provinceSelect.value;
            const boxType = getCurrentBoxType();
            console.log('Loading products for region:', region, 'and box type:', boxType);
            
            const path = boxType + '/' + (region === 'ontario_quebec' ? 'Ontario and Quebec' : 'Alberta and British Columbia');
            console.log('Database path:', path);
            const productsRef = database.ref(path);

            productsList.innerHTML = '<div class="text-center py-4">Loading products...</div>';

            productsRef.once('value')
                .then((snapshot) => {
                    console.log('Data received:', snapshot.val());
                    productsList.innerHTML = '';
                    const products = snapshot.val();

                    if (!products) {
                        console.log('No products found');
                        productsList.innerHTML = '<div class="text-center py-4">No products found</div>';
                        return;
                    }

                    Object.entries(products).forEach(([key, product]) => {
                        console.log('Processing product:', key, product);
                        if (product.name && product.imageUrl) {
                            const productElement = createProductElement(product);
                            productsList.appendChild(productElement);
                        }
                    });
                })
                .catch((error) => {
                    console.error('Error loading products:', error);
                    productsList.innerHTML = `<div class="text-center py-4 text-red-600">Error loading products: ${error.message}</div>`;
                });
        }

        function createProductElement(product) {
            const div = document.createElement('div');
            div.className = 'text-center';
            div.innerHTML = `
                <img src="${product.imageUrl}" alt="${product.name}" id="product-image">
                <h3 id="product-name">${product.name}</h3>
                <p id="product-quantity">${product.quantity}</p>
            `;
            return div;
        }
    </script>
</body>
</html>
