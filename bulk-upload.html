    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGm1mZObECZzi8r1MA7gamJW_v_7v0tZw",
            authDomain: "substitution-form-shopify-app.firebaseapp.com",
            databaseURL: "https://substitution-form-shopify-app-default-rtdb.firebaseio.com",
            projectId: "substitution-form-shopify-app",
            storageBucket: "substitution-form-shopify-app.firebasestorage.app",
            messagingSenderId: "857195381141",
            appId: "1:857195381141:web:310d7854d9db510486369c"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        document.getElementById('bulkUploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const products = [];
                let hasErrors = false;

                // Process each product
                for (let i = 1; i <= 10; i++) {
                    const name = document.querySelector(`[name="product${i}-name"]`).value.trim();
                    const quantity = document.querySelector(`[name="product${i}-quantity"]`).value.trim();
                    const imageFile = document.querySelector(`[name="product${i}-image"]`).files[0];

                    // Skip empty entries
                    if (!name && !quantity && !imageFile) continue;

                    // Validate required fields
                    if (!name || !quantity || !imageFile) {
                        alert(`Please fill all fields for Product ${i}`);
                        hasErrors = true;
                        break;
                    }

                    products.push({
                        name,
                        quantity,
                        imageFile
                    });
                }

                if (hasErrors || products.length === 0) {
                    if (products.length === 0) alert('Please fill in at least one product');
                    return;
                }

                // Show loading message
                alert('Uploading products... Please wait.');

                // Upload each product
                for (const product of products) {
                    // Upload image first
                    const imageRef = storage.ref(`product-images/${Date.now()}_${product.imageFile.name}`);
                    const snapshot = await imageRef.put(product.imageFile);
                    const imageUrl = await snapshot.ref.getDownloadURL();

                    // Save product data
                    const productData = {
                        name: product.name,
                        quantity: product.quantity,
                        imageUrl: imageUrl
                    };

                    await database.ref('products').push(productData);
                }

                // Show success message
                alert('All products uploaded successfully!');
                
                // Reset form
                e.target.reset();
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error uploading products. Please try again.');
            }
        });
    </script>
